[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/reception.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "inline; filename=\"majida-umair-reception.ics\""
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
